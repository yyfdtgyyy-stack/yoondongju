
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진으로 만나는 시인 윤동주</title>

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/webfontworld/naver/NanumBarunGothic.css" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #E8DDCB;
    color: #242424;
    font-family: 'Nanum Myeongjo', serif;
}

.page-wrap {
    width: 85%;
    max-width: 1100px;
    margin: 40px auto;
    padding: 35px;
    background: #F5F1E8;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

/* 상단 카테고리 */
.navigation {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    align-items: center;
    width: 100%;
    padding: 15px 8px;
    margin-bottom: 35px;
    background: #E8DDCB;
    border-radius: 6px;
}

.navigation a {
    min-width: 0;
    padding: 12px 5px;
    text-align: center;
    white-space: nowrap;
    font-family: 'NanumBarunGothic', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #603B2B;
    background: transparent;
    text-decoration: none;
    border-right: 1px solid #B49D8B;
    transition: background-color 0.25s ease,
                color 0.25s ease,
                transform 0.2s ease;
}

.navigation a:last-child {
    border-right: none;
}

.navigation a:hover {
    background: #78594A;
    color: white;
    border-radius: 4px;
    transform: translateY(-2px);
}

.navigation a:active {
    background: #543D32;
    color: white;
    transform: translateY(0);
}

.navigation a:focus-visible {
    outline: 2px solid #78594A;
    outline-offset: 2px;
}

/* 본문 */
.content {
    padding: 20px 35px;
}

.content h1 {
    font-size: 32px;
    margin-bottom: 20px;
}

.gallery-intro {
    font-size: 17px;
    line-height: 1.9;
    color: #4A443C;
    margin-bottom: 40px;
}

/* 사진 갤러리 */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 25px;
}

.gallery-item {
    min-width: 0;
    background: #E8DDCB;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.gallery-item a {
    display: block;
    overflow: hidden;
    border-radius: 5px;
}

.gallery-item img {
    display: block;
    width: 100%;
    height: 300px;
    object-fit: cover;
    object-position: center 25%;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.gallery-item a:hover img {
    transform: scale(1.05);
}

.gallery-item p {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.6;
    margin-top: 15px;
}

/* 하단 */
.copyright {
    text-align: center;
    font-size: 13px;
    margin-top: 30px;
    padding: 20px;
}

@media (max-width: 900px) {
    .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 700px) {
    .page-wrap {
        width: 96%;
        margin: 15px auto;
        padding: 12px;
    }

    .navigation {
        padding: 10px 3px;
    }

    .navigation a {
        font-size: clamp(10px, 2.5vw, 15px);
        padding: 10px 2px;
    }

    .content {
        padding: 10px;
    }

    .content h1 {
        font-size: 26px;
    }
}

@media (max-width: 600px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .gallery-item img {
        height: 350px;
    }
}
</style>
</head>
