<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

/* 전체 배경 */
body {
    background-color: #E8DDCB;
    color: #242424;
    font-family: 'Nanum Myeongjo', serif;
    margin: 0;
    padding: 0;
}

/* 전체 페이지 */
.page-wrap {
    width: 85%;
    max-width: 1100px;
    margin: 40px auto;
    background-color: #F5F1E8;
    padding: 35px;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

/* 상단 메뉴 - 기존 디자인 유지 */
.navigation {
    text-align: center;
    padding: 20px;
    background-color: #E8DDCB;
    border-radius: 6px;
    margin-bottom: 35px;
    line-height: 2;
}

.navigation a {
    color: #242424;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    margin: 0 8px;
}

.navigation a:hover {
    color: #78594A;
    text-decoration: underline;
}

/* 본문 */
.content {
    padding: 20px 35px;
}

/* 제목 */
.content h1 {
    color: #242424;
    font-size: 32px;
    margin-bottom: 20px;
}

/* 소개 문구 */
.gallery-intro {
    font-size: 17px;
    line-height: 1.9;
    color: #4A443C;
    margin-bottom: 40px;
}

/* 사진 갤러리 */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

/* 사진 카드 */
.gallery-item {
    background-color: #E8DDCB;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

/* 사진 */
.gallery-item img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    object-position: center 25%;
    border-radius: 5px;
    display: block;
    transition: transform 0.3s ease;
}

/* 마우스 확대 효과 */
.gallery-item img:hover {
    transform: scale(1.04);
}

/* 사진 설명 */
.gallery-item p {
    color: #242424;
    font-size: 15px;
    font-weight: bold;
    margin-top: 15px;
    line-height: 1.6;
}

/* 하단 저작권 */
.copyright {
    text-align: center;
    color: #242424;
    font-size: 13px;
    margin-top: 40px;
    padding: 20px;
}

/* 태블릿 */
@media (max-width: 900px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* 모바일 */
@media (max-width: 600px) {
    .page-wrap {
        width: auto;
        margin: 15px;
        padding: 15px;
    }

    .content {
        padding: 10px;
    }

    .gallery {
        grid-template-columns: 1fr;
    }

    .gallery-item img {
        height: 350px;
    }
}

</style>

</head>
